<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Parqueadero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="car" class="w-7 h-7 text-blue-400"></i>
        <span class="font-bold text-xl">ParkControl</span>
      </div>
      <div id="navActions" class="flex gap-2">
        <button id="btnRolePublic" onclick="switchView('public')" class="px-3 py-1.5 rounded-md text-sm font-medium bg-blue-600 text-white">Consulta Pública</button>
        <button id="btnRoleAdmin" onclick="switchView('admin')" class="px-3 py-1.5 rounded-md text-sm font-medium text-slate-300 hover:text-white">Panel Admin</button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-4 md:p-6">

    <!-- VISTA 1: CONSULTA PÚBLICA (CLIENTES) -->
    <section id="viewPublic" class="space-y-6">
      <div class="max-w-xl mx-auto text-center space-y-4 py-8">
        <h1 class="text-3xl font-extrabold text-slate-900">Consulta el Estado de tu Vehículo</h1>
        <p class="text-slate-600 text-sm">Ingresa tu placa para verificar hora de ingreso, abono entregado y el saldo pendiente.</p>
        
        <div class="flex gap-2">
          <input type="text" id="searchPlate" placeholder="ABC-1234" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 uppercase font-bold tracking-wider text-lg outline-none">
          <button onclick="searchPlatePublic()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2">
            <i data-lucide="search" class="w-5 h-5"></i> Buscar
          </button>
        </div>
      </div>
      <div id="publicResult" class="max-w-xl mx-auto hidden"></div>
    </section>

    <!-- VISTA 2: LOGIN ADMINISTRADOR -->
    <section id="viewLogin" class="hidden max-w-md mx-auto pt-12">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-2xl font-bold text-slate-900 text-center">Acceso Administrador</h2>
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Correo Electrónico</label>
            <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña</label>
            <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button type="submit" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl hover:bg-slate-800">Iniciar Sesión</button>
        </form>
      </div>
    </section>

    <!-- VISTA 3: PANEL ADMINISTRADOR PRIVADO -->
    <section id="viewAdmin" class="hidden space-y-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
        <div>
          <h2 class="text-2xl font-bold text-slate-900">Panel de Control</h2>
          <p class="text-slate-500 text-sm">Registro de ingresos, abonos y cobros de salida.</p>
        </div>
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-2 bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-xl">
            <label class="text-xs font-semibold text-blue-900">Tarifa/Hora ($):</label>
            <input type="number" id="hourlyRate" value="2.00" step="0.5" class="w-16 text-center font-bold bg-white border rounded">
          </div>
          <button onclick="handleLogout()" class="text-xs bg-red-50 text-red-600 px-3 py-2 rounded-lg font-bold border border-red-200 hover:bg-red-100">Cerrar Sesión</button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Formulario de Registro con Abono -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-1 space-y-4">
          <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> Registrar Ingreso
          </h3>
          <form onsubmit="handleEntry(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Placa del Vehículo</label>
              <input type="text" id="inputPlate" required placeholder="ABC-1234" class="w-full px-3 py-2 border rounded-lg uppercase font-bold tracking-wider outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-emerald-700 uppercase mb-1">Abono Inicial ($)</label>
              <input type="number" id="inputDeposit" step="0.25" min="0" value="0.00" required class="w-full px-3 py-2 border border-emerald-300 bg-emerald-50 text-emerald-900 font-bold rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Fotos</label>
              <input type="file" id="inputPhotos" multiple accept="image/*" class="w-full text-xs text-slate-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Observaciones</label>
              <textarea id="inputNotes" rows="2" placeholder="Estado de carrocería, cascos..." class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <button type="submit" id="btnSubmitEntry" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 flex justify-center items-center gap-2">
              <span>Registrar Entrada</span>
            </button>
          </form>
        </div>

        <!-- Lista de Vehículos Estacionados -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-2 space-y-4">
          <h3 class="text-lg font-bold text-slate-900">Vehículos en Parqueadero</h3>
          <div id="activeList" class="space-y-3"></div>
        </div>

      </div>
    </section>

  </main>

  <script>
    // CREDENCIALES CONFIGURADAS
    const SUPABASE_URL = 'https://xsviioiajgmqsgbnqbxv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhzdmlpb2lhamdtcXNnYm5xYnh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDE1ODYsImV4cCI6MjEwNTQxNzU4Nn0.m0Q3DOpwsiRoNpcWj3_nOdqN-lmRGMJnYuUIfs7-Iak';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    lucide.createIcons();

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await db.auth.getSession();
      currentUser = session?.user || null;
      switchView('public');
    });

    function switchView(view) {
      document.getElementById('viewPublic').classList.add('hidden');
      document.getElementById('viewLogin').classList.add('hidden');
      document.getElementById('viewAdmin').classList.add('hidden');

      if (view === 'admin') {
        if (currentUser) {
          document.getElementById('viewAdmin').classList.remove('hidden');
          loadAdminVehicles();
        } else {
          document.getElementById('viewLogin').classList.remove('hidden');
        }
      } else {
        document.getElementById('viewPublic').classList.remove('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Error de acceso: ' + error.message);
      } else {
        currentUser = data.user;
        switchView('admin');
      }
    }

    async function handleLogout() {
      await db.auth.signOut();
      currentUser = null;
      switchView('public');
    }

    async function handleEntry(e) {
      e.preventDefault();
      const plate = document.getElementById('inputPlate').value.trim().toUpperCase();
      const deposit = parseFloat(document.getElementById('inputDeposit').value) || 0;
      const notes = document.getElementById('inputNotes').value.trim();
      const files = document.getElementById('inputPhotos').files;
      const btn = document.getElementById('btnSubmitEntry');

      btn.disabled = true;
      btn.innerText = "Subiendo datos...";

      try {
        let photoUrls = [];
        for (let file of files) {
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random()}.${fileExt}`;
          const { error: uploadErr } = await db.storage.from('fotos_parqueadero').upload(fileName, file);

          if (!uploadErr) {
            const { data: publicUrlData } = db.storage.from('fotos_parqueadero').getPublicUrl(fileName);
            photoUrls.push(publicUrlData.publicUrl);
          }
        }

        const { error: insertError } = await db.from('vehiculos').insert([{
          placa: plate,
          abono: deposit,
          observaciones: notes || 'Sin observaciones',
          fotos: photoUrls,
          estado: 'ACTIVO'
        }]);

        if (insertError) throw insertError;

        document.getElementById('inputPlate').value = '';
        document.getElementById('inputDeposit').value = '0.00';
        document.getElementById('inputNotes').value = '';
        document.getElementById('inputPhotos').value = '';
        loadAdminVehicles();

      } catch (err) {
        alert('Error registrando vehículo: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Registrar Entrada";
      }
    }

    async function loadAdminVehicles() {
      const { data, error } = await db.from('vehiculos').select('*').eq('estado', 'ACTIVO').order('hora_ingreso', { ascending: false });
      const container = document.getElementById('activeList');

      if (error || !data.length) {
        container.innerHTML = `<p class="text-slate-400 text-center py-4">No hay vehículos en parqueadero.</p>`;
        return;
      }

      const rate = parseFloat(document.getElementById('hourlyRate').value) || 2.0;

      container.innerHTML = data.map(v => {
        const entry = new Date(v.hora_ingreso);
        const hours = Math.max(1, Math.ceil((new Date() - entry) / (1000 * 60 * 60)));
        const totalCalculated = hours * rate;
        const abono = v.abono || 0;
        const pendingBalance = Math.max(0, totalCalculated - abono).toFixed(2);

        return `
          <div class="border rounded-xl p-4 flex justify-between items-center bg-slate-50">
            <div>
              <div class="flex items-center gap-2">
                <span class="bg-slate-900 text-white font-black px-2 py-1 rounded text-sm">${v.placa}</span>
                <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">Abonó: $${abono.toFixed(2)}</span>
              </div>
              <p class="text-xs text-slate-500 mt-1">Ingreso: ${entry.toLocaleTimeString()}</p>
              <p class="text-xs text-slate-600 mt-1">Obs: ${v.observaciones}</p>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400 block">Total: $${totalCalculated.toFixed(2)}</span>
              <span class="text-lg font-black text-emerald-600 block">Saldo: $${pendingBalance}</span>
              <button onclick="processExit('${v.id}', '${pendingBalance}', '${totalCalculated.toFixed(2)}')" class="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg mt-1 hover:bg-emerald-700">Cobrar y Salir</button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function processExit(id, pendingBalance, totalCalculated) {
      if (!confirm(`¿Confirmar salida?\n\nTotal generado: $${totalCalculated}\nSaldo pendiente a cobrar: $${pendingBalance}`)) return;

      const { error } = await db.from('vehiculos').update({
        hora_salida: new Date().toISOString(),
        estado: 'COMPLETADO',
        total_pagado: parseFloat(totalCalculated)
      }).eq('id', id);

      if (!error) loadAdminVehicles();
    }

    async function searchPlatePublic() {
      const plate = document.getElementById('searchPlate').value.trim().toUpperCase();
      const container = document.getElementById('publicResult');

      if (!plate) return alert('Ingresa una placa.');

      const { data, error } = await db.from('vehiculos').select('*').eq('placa', plate).order('hora_ingreso', { ascending: false }).limit(1);

      container.classList.remove('hidden');

      if (error || !data.length) {
        container.innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-xl text-center">No se encontró registro activo para la placa ${plate}.</div>`;
        return;
      }

      const v = data[0];
      const entry = new Date(v.hora_ingreso);
      const isCompleted = v.estado === 'COMPLETADO';
      const exitTime = isCompleted ? new Date(v.hora_salida) : new Date();
      const hours = Math.max(1, Math.ceil((exitTime - entry) / (1000 * 60 * 60)));
      const rate = parseFloat(document.getElementById('hourlyRate').value) || 2.0;

      const totalFee = isCompleted ? v.total_pagado : (hours * rate);
      const abono = v.abono || 0;
      const pending = Math.max(0, totalFee - abono).toFixed(2);

      container.innerHTML = `
        <div class="bg-white border rounded-2xl p-6 shadow-md space-y-4">
          <div class="flex justify-between items-center border-b pb-3">
            <div>
              <span class="text-xs font-bold text-slate-400 uppercase">Vehículo</span>
              <h3 class="text-2xl font-black text-slate-900 tracking-wider">${v.placa}</h3>
            </div>
            <span class="text-xs font-bold px-3 py-1 rounded-full ${isCompleted ? 'bg-slate-200' : 'bg-emerald-100 text-emerald-800'}">${v.estado}</span>
          </div>

          <div class="grid grid-cols-2 gap-4 text-xs">
            <div>
              <span class="text-slate-500 block">Hora de Ingreso:</span>
              <strong class="text-slate-800">${entry.toLocaleString()}</strong>
            </div>
            <div>
              <span class="text-slate-500 block">Abono Inicial:</span>
              <strong class="text-emerald-700">$${abono.toFixed(2)}</strong>
            </div>
          </div>

          <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 text-xs">
            <span class="text-slate-500 font-bold block mb-1">Observaciones:</span>
            <p class="text-slate-700">${v.observaciones}</p>
          </div>

          ${v.fotos && v.fotos.length ? `
            <div>
              <span class="text-slate-500 block text-xs font-bold uppercase mb-2">Fotos Registradas:</span>
              <div class="grid grid-cols-3 gap-2">
                ${v.fotos.map(url => `<img src="${url}" class="h-20 w-full object-cover rounded-lg border">`).join('')}
              </div>
            </div>
          ` : ''}

          <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-center">
            <span class="text-xs font-bold text-blue-800 block uppercase">${isCompleted ? 'Total Pagado Final' : 'Saldo Pendiente a Pagar'}</span>
            <span class="text-3xl font-black text-blue-900">$${pending}</span>
            ${!isCompleted ? `<span class="text-xs text-slate-500 block mt-1">(Total generado: $${totalFee.toFixed(2)} - Abono:$${abono.toFixed(2)})</span>` : ''}
          </div>
        </div>
      `;
      lucide.createIcons();
    }
  </script>
</body>
</html>
